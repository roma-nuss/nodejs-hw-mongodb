tags:
  - Contacts
summary: Get a list of contacts
operationId: getContacts
description: Retrieve a list of all contacts with optional query parameters.
security:
  - BearerAuth: []
parameters:
  - name: page
    in: query
    description: Page number for pagination.
    schema:
      type: integer
      default: 1
  - name: limit
    in: query
    description: Number of contacts per page.
    schema:
      type: integer
      default: 10
responses:
  200:
    description: Successfully retrieved the list of contacts.
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '#/components/schemas/Contact'
  404:
    description: Contacts not found.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Error'
