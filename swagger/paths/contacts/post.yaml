tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Create a new contact with the provided information.
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: 'John Doe'
          email:
            type: string
            example: 'johndoe@example.com'
          # добавьте другие поля, которые вы хотите принимать, например:
          phone:
            type: string
            example: '+123456789'
          # другие поля, кроме avatar, address, phone
        required:
          - name
          - email
responses:
  '201':
    description: Contact successfully created.
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
