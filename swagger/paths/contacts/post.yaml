tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Create a new contact with the provided information.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: 'John Doe'
          email:
            type: string
            example: 'johndoe@example.com'
          phoneNumber:
            type: string
            example: '+123456789'
          isFavourite:
            type: boolean
            example: true
          contactType:
            type: string
            enum: ['work', 'home', 'personal']
            example: 'work'
          photo:
            type: string
            format: binary
        required:
          - name
          - email
responses:
  '201':
    description: Contact successfully created.
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
