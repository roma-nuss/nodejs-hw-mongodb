#//swagger/paths/students/{id}/patch.yaml
tags:
  - Students
summary: Update student by ID
operationId: updateStudent
description: 'Update the student information by ID.'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: studentId
    required: true
    schema:
      type: string
    description: 'The ID of the student to update.'
requestBody:
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            example: 'John Doe'
          age:
            type: integer
            example: 20
          gender:
            type: string
            enum: ['male', 'female', 'other']
            example: 'male'
responses:
  '200':
    description: Student updated successfully!
  '404':
    description: Student not found!
